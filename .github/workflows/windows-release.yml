name: Windows build and release
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match package.json version' }
      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          npm run dist:win 2>&1 | Tee-Object -FilePath windows-build.log
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            $details = (Get-Content windows-build.log -Tail 60) -join "`n"
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows installer build failed::$details"
            exit $buildExitCode
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Raumakustik-Windows-x64
          path: |
            release/*Setup.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Raumakustik-Windows-x64
          path: artifacts
      - name: Publish public update assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/* --verify-tag --generate-notes --title "Raumakustik $RELEASE_TAG" --notes "Erste Ausbaustufe für Windows 10/11 x64: 3D-Rechteckraum, Moden und Reflexionen, REW-Dateiimport und Analyseberichte. ChatGPT wird per manueller Browser-Übergabe genutzt; die direkte OpenAI-Verbindung benötigt einen separat abgerechneten API-Schlüssel. Der Installer ist noch nicht signiert. Installation und vollständige Updates auf einem Windows-PC sind noch nicht praktisch validiert. Physikalische Grenzen und offene Funktionen stehen in README.md und docs/ROADMAP.md."
